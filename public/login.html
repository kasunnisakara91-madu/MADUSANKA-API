<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MADUSANKA API</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="background"></div>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                M
            </div>

            <h1>
                MADUSANKA API
            </h1>

            <p class="subtitle">
                Developer Platform
            </p>

            <div class="divider"></div>

            <h2>
                Welcome Back
            </h2>

            <p class="description">
                Sign in with your Google account
                to access your dashboard.
            </p>

            <a
                href="/auth/google"
                class="google-btn"
            >

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </a>

            <p class="secure">
                🔒 Secure Google authentication
            </p>

        </div>

    </main>

</body>

  </html>
